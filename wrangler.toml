name = "cerva-crm"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cerva-crm"
database_id = "9a62323f-1112-47aa-a5f4-ce164ca8dc0f"
migrations_dir = "migrations"

[triggers]
# Sync Gmail last-contact every 30 minutes
crons = ["*/30 * * * *"]

[observability]
enabled = true

[observability.traces]
enabled = true
